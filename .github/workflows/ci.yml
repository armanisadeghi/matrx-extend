# CI for matrx-extend (docs/AUDIT_2026_06_10.md P0-8).
#
# Before this workflow existed NOTHING was enforced on PRs: `wxt build`
# transpiles per-file via esbuild with no whole-program type analysis, the
# `compile` script was never invoked by anything, lint was opt-in manual, and
# husky was never installed. A type error could (and did) ship to the Web
# Store. These four jobs are the floor:
#
#   typecheck — tsc --noEmit (strict + noUncheckedIndexedAccess)
#   lint      — biome check (error-level rules block; warn promotion tracked
#               as audit item P2-3)
#   test      — vitest unit suite
#   build     — production wxt build from a clean checkout. The guide parity
#               test supplies its separately pinned, read-only server source.
#
# The DB drift check is NOT here — CI has no Supabase creds, and the
# non-strict script would just skip. Releases run the strict variant via
# release.sh where creds exist.

name: CI

on:
  push:
    branches: [main]
    # Immutable release tags need their own verification lane. Their ref differs
    # from main, so the existing ref-scoped concurrency rule cannot cancel this
    # evidence when a later main commit lands.
    tags: ['v*']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # The complete records guide comes only from aidream's guide_for. The
      # server repository is private: this preflight deliberately fails before
      # tests if the approved read-only deploy key is not configured.
      # CI must measure this pinned server revision, never ambient machine state.
      - name: Require canonical records reader
        env:
          AIDREAM_DEPLOY_KEY: ${{ secrets.AIDREAM_DEPLOY_KEY }}
        run: |
          if [ -z "$AIDREAM_DEPLOY_KEY" ]; then
            echo "::error::AIDREAM_DEPLOY_KEY is required for records-guide parity; configure the approved read-only AI Dream deploy key."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          repository: AI-Matrix-Engine/aidream
          # Must match the immutable AI Dream revision that produced the checked-in
          # records-guide artifact during the release candidate generation.
          ref: 0b12e258aa5d1965ac8d2a812b09ed5b553d72ee
          path: .canonical/aidream
          ssh-key: ${{ secrets.AIDREAM_DEPLOY_KEY }}
          ssh-strict: true
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        # Version comes from package.json's "packageManager" field.

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm compile

      # Supabase table routing. The DB split `public` into ~48 domain schemas, so
      # an unqualified `.from('wbx_pattern')` resolves to a table that no longer
      # exists and 404s (PGRST205) in the USER'S BROWSER — tsc, lint, the tests,
      # and the build are all blind to it. This is the only gate that sees it.
      - name: Schema routing
        run: pnpm check:schema-routing:strict

      # THERE IS ONE AGENT PICKER — `@ai-matrx/agents/catalog/react` (ruling D1,
      # 2026-09-08). This repo shipped FOUR hand-rolled agent selectors, each
      # with its own membership rule and order, which is exactly how one
      # client's list stops matching another's. The guard was wired into the
      # `prebuild`/`prezip` lifecycle hooks and `release.sh` only — and CI
      # builds with `pnpm wxt build`, which does NOT trigger the `build`
      # script's `prebuild`, so nothing here ran it until 2026-09-08.
      - name: THERE IS ONE AGENT PICKER
        run: pnpm check:canonical-pickers

      # A guard you cannot demonstrate failing is not a guard. Until 2026-09-08
      # the patterns required a character BEFORE "Agent", so a component named
      # exactly `AgentPicker` walked through.
      - name: the picker guard can still fail (self-test)
        run: pnpm check:canonical-pickers:self-test

      # THE ARCHIVED-ITEMS LAW (Arman, 2026-09-09 —
      # ../common-docs/policies/archived-items.md): every list over an
      # archivable entity carries an archive filter, the default hides
      # archived, and revealing them is one or two clicks. Today the only such
      # list here is the agent picker (the package owns its chip) — this guard
      # is what makes the next one obey.
      - name: THE ARCHIVED-ITEMS LAW
        run: pnpm check:archived-items-law

      - name: the archive guard can still fail (self-test)
        run: pnpm check:archived-items-law:self-test

      # ACCESS LADDER T-13: the row column retires into shown_to (a list filter)
      # and published_to_web (the only anonymous lane). No file gains a literal
      # reference to it; the per-file baseline only shrinks. A signal, never a
      # gate (pre-launch: a new blocking gate needs Arman's approval).
      - name: T-13 no new reference to the retiring row column
        continue-on-error: true
        run: pnpm check:t13-row-column

      - name: the T-13 row-column guard can still fail (self-test)
        continue-on-error: true
        run: pnpm check:t13-row-column:self-test

      # A SIGN-OUT ENDS ONLY THE DEVICE THAT ASKED. A bare supabase-js
      # signOut() / scope-less GoTrue /logout is scope "global": it deletes
      # every session the account holds, including the OAuth session Claude
      # Code / claude.ai / Codex use for the AI Dream MCP (2026-09-15 incident,
      # Matrx Local account switch). flow.ts already sends ?scope=local; this
      # keeps it that way. ~1s static scan with self-test.
      - name: A SIGN-OUT ENDS ONLY THE DEVICE THAT ASKED
        run: pnpm check:signout-scope
      - name: the sign-out scope guard can still fail (self-test)
        run: pnpm check:signout-scope:self-test

      # MANDATE REFERENCES — a non-blocking job step (ruling D23). It reports
      # every Mandate this extension names, and every bypass, to the platform.
      # `continue-on-error` is the law, not a convenience: a reference check may
      # never be the reason a push to main goes red.
      #
      # The version is pinned EXACTLY. "Always latest" governs @ai-matrx npm
      # packages; this is a python release gate whose output is compared across
      # revisions, so what it measures may not drift between two commits.
      #
      # CI carries no SUPABASE_SECRET_KEY, so this step SCANS and prints and
      # says UNMEASURED-for-report — loudly, never silently. The release script
      # and the scheduled remediation task are what submit.
      - name: Mandate references (non-blocking; scan only in CI)
        continue-on-error: true
        run: uvx --from matrx-mandate-scan@latest matrx-mandate-scan check

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        env:
          RECORDS_GUIDE_SOURCE: ${{ github.workspace }}/.canonical/aidream
        run: pnpm test

      - name: Production build
        run: pnpm wxt build
