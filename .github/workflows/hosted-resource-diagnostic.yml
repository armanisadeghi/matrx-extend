name: Hosted resource diagnosis
run-name: ${{ github.event_name == 'workflow_dispatch' && format('{0} (by {1})', github.workflow, inputs.requested_by || 'manual') || '' }}

on:
  workflow_dispatch:
    inputs:
      requested_by:
        description: "Agent session or lane that asked for this run (ci-spend attribution)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: macos-15-intel
    timeout-minutes: 5
    concurrency:
      group: hosted-guest-side-panel-A
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Compare bounded read-only CPU samplers
        run: node scripts/hosted-resource-diagnostic.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resource-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/hosted-resource-diagnostic.json
          if-no-files-found: error
