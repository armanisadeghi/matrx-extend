name: Hosted guest side-panel acceptance
run-name: "Native ${{ inputs.acceptance_lane }} · ${{ inputs.acceptance_case }}"

on:
  workflow_dispatch:
    inputs:
      acceptance_lane:
        description: Bounded hosted browser lane; use A for shared member/admin credentials
        required: true
        default: A
        type: choice
        options:
          - A
          - B
      runner_label:
        description: Standard macOS runner for the guarded acceptance
        required: true
        default: macos-15-intel
        type: choice
        options:
          - macos-15-intel
          - macos-15
      release_run_id:
        description: Successful Hosted release run whose exact validated artifact will be tested
        required: false
        type: string
      development_run_id:
        description: Successful CI main-push run for interim development-build evidence
        required: false
        type: string
      development_artifact_id:
        description: Exact CI development artifact ID, verified by the existing importer
        required: false
        type: string
      published_store_crx:
        description: Test exact published 0.2.205 CRX from Google's public update service
        required: false
        default: false
        type: boolean
      acceptance_case:
        description: Native-panel case to exercise
        required: false
        default: guest-chat
        type: choice
        options:
          - guest-chat
          - guest-seo
          - guest-data
          - member-data
          - guest-scrape
          - guest-scrape-development
          - scrape-save-member
          - settings-controls
          - settings-theme-rendering
          - settings-auto-scrape-capture
          - settings-persistence
          - settings-persistence-admin
          - settings-persistence-member
          - desktop-settings-guest
          - desktop-settings-member
          - desktop-settings-admin
          - visibility-census-guest
          - visibility-census-member
          - visibility-census-admin
          - audit-key-admin
          - member-chat
          - prepare-stale-results
          - showcase-picker-admin
          - showcase-stale-admin
          - showcase-d47-admin
          - showcase-d47-public-admin
          - records-readonly-admin
          - profile-admin
          - profile-member
          - startup-resource-diagnostic
      seo_case_scope:
        description: Guest SEO checks to run; controlled keeps the T02/T14 phase and excludes volatile public-detail checks
        required: false
        default: full
        type: choice
        options:
          - full
          - controlled
      seo_metadata_fixture:
        description: Optional live public metadata page for full guest SEO T09
        required: false
        default: none
        type: choice
        options:
          - none
          - airbnb
      startup_display_mode:
        description: Display mode for startup-resource-diagnostic only
        required: false
        default: headed
        type: choice
        options:
          - headed
          - headless
      seo_resource_diagnostic:
        description: Measure process CPU time on full guest SEO Airbnb; diagnostic only, no acceptance credit
        required: false
        default: false
        type: boolean
      seo_interrupt_after_target:
        description: Diagnostic-only SIGTERM after the controlled guest SEO manual re-audit target checkpoint
        required: false
        default: none
        type: choice
        options:
          - none
          - manual_button_returns_to_current_page
      desktop_settings_case:
        description: Desktop Settings guest path; remaining covers pair-code forget and reset cancel
        required: false
        default: full
        type: choice
        options:
          - full
          - remaining
      d47_response_order:
        description: D47 held HTTP response order for showcase-d47-admin
        required: false
        default: current-first
        type: choice
        options:
          - current-first
          - old-first
          - stale-only
          - manual-prior
          - prior-saved
      d47_public_race_preflight:
        description: Timing-only public response pause preflight for showcase-d47-public-admin
        required: false
        default: false
        type: boolean
      scrape_diagnostic_cpu_rate:
        description: Optional owned intake-page CPU diagnostic rate for guest-scrape or guest-scrape-development (for example 4)
        required: false
        type: string
      scrape_reload_open_diagnostic:
        description: Probe replacement-worker panel open in guest-scrape-development; diagnostic-only, never acceptance credit
        required: false
        default: false
        type: boolean
      scrape_auth_mode:
        description: Scrape identity to verify through real sign-in
        required: false
        default: guest
        type: choice
        options:
          - guest
          - member
          - admin
      scrape_width_mode:
        description: Scrape side-panel viewport mode (normal uses CDP viewport emulation)
        required: false
        default: narrow
        type: choice
        options:
          - narrow
          - normal
      scrape_normal_width_px:
        description: Required observed side-panel viewport width in normal mode
        required: false
        type: string

permissions:
  actions: read
  contents: read

jobs:
  guest:
    runs-on: ${{ inputs.runner_label == 'macos-15' && 'macos-15' || 'macos-15-intel' }}
    timeout-minutes: 15
    concurrency:
      # The closed expression maps even malformed dispatch inputs to A; preflight then refuses them.
      group: ${{ inputs.acceptance_lane == 'B' && 'hosted-guest-side-panel-B' || 'hosted-guest-side-panel-A' }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Require bounded lane and isolate shared credentials
        shell: bash
        env:
          ACCEPTANCE_LANE: ${{ inputs.acceptance_lane }}
          ACCEPTANCE_CASE: ${{ inputs.acceptance_case }}
          SEO_CASE_SCOPE: ${{ inputs.seo_case_scope }}
          SEO_METADATA_FIXTURE: ${{ inputs.seo_metadata_fixture || 'none' }}
          SEO_INTERRUPT_AFTER_TARGET: ${{ inputs.seo_interrupt_after_target || 'none' }}
          SCRAPE_AUTH_MODE: ${{ inputs.scrape_auth_mode }}
          DESKTOP_SETTINGS_CASE: ${{ inputs.desktop_settings_case }}
        run: |
          # BEGIN hosted lane admission
          [[ "$ACCEPTANCE_LANE" == A || "$ACCEPTANCE_LANE" == B ]] || { echo 'Unknown hosted acceptance lane.' >&2; exit 1; }
          case "$ACCEPTANCE_CASE" in
            guest-chat|guest-seo|guest-data|member-data|guest-scrape|guest-scrape-development|scrape-save-member|settings-controls|settings-theme-rendering|settings-auto-scrape-capture|settings-persistence|settings-persistence-admin|settings-persistence-member|desktop-settings-guest|desktop-settings-member|desktop-settings-admin|visibility-census-guest|visibility-census-member|visibility-census-admin|audit-key-admin|member-chat|prepare-stale-results|showcase-picker-admin|showcase-stale-admin|showcase-d47-admin|showcase-d47-public-admin|records-readonly-admin|profile-admin|profile-member|startup-resource-diagnostic) ;;
            *) echo 'Unknown hosted acceptance case.' >&2; exit 1 ;;
          esac
          if [[ "$ACCEPTANCE_CASE" == scrape-save-member ]]; then
            [[ "$SCRAPE_AUTH_MODE" == member ]] || { echo 'D187 Save Source requires member auth.' >&2; exit 1; }
          fi
          [[ "$DESKTOP_SETTINGS_CASE" == full || "$DESKTOP_SETTINGS_CASE" == remaining ]] || { echo 'Unknown Desktop Settings case.' >&2; exit 1; }
          [[ "$SEO_CASE_SCOPE" == full || "$SEO_CASE_SCOPE" == controlled ]] || { echo 'Unknown SEO case scope.' >&2; exit 1; }
          [[ "$SEO_CASE_SCOPE" == full || "$ACCEPTANCE_CASE" == guest-seo ]] || { echo 'Controlled SEO scope requires guest-seo.' >&2; exit 1; }
          [[ "$SEO_METADATA_FIXTURE" == none || "$SEO_METADATA_FIXTURE" == airbnb ]] || { echo 'Unknown SEO metadata fixture.' >&2; exit 1; }
          if [[ "$SEO_METADATA_FIXTURE" == airbnb ]]; then
            [[ "$ACCEPTANCE_CASE" == guest-seo && "$SEO_CASE_SCOPE" == full ]] || { echo 'SEO metadata fixture requires full guest-seo.' >&2; exit 1; }
          fi
          if [[ "${SEO_INTERRUPT_AFTER_TARGET:-none}" != none ]]; then
            [[ "$SEO_INTERRUPT_AFTER_TARGET" == manual_button_returns_to_current_page && "$ACCEPTANCE_CASE" == guest-seo && "$SEO_CASE_SCOPE" == controlled && "$SEO_METADATA_FIXTURE" == none && "$ACCEPTANCE_LANE" == B ]] || { echo 'SEO interruption requires lane B controlled guest-seo without fixture.' >&2; exit 1; }
          fi
          if [[ "$DESKTOP_SETTINGS_CASE" == remaining ]]; then
            [[ "$ACCEPTANCE_CASE" == desktop-settings-guest ]] || { echo 'Remaining Desktop Settings case requires guest.' >&2; exit 1; }
          fi
          if [[ "$ACCEPTANCE_LANE" == B ]]; then
            case "$ACCEPTANCE_CASE" in
              *-admin|*-member|member-chat|member-data|prepare-stale-results|showcase-*)
                echo 'Shared member/admin fixture requires lane A.' >&2; exit 1 ;;
            esac
            if [[ "$ACCEPTANCE_CASE" == guest-scrape || "$ACCEPTANCE_CASE" == guest-scrape-development || "$ACCEPTANCE_CASE" == scrape-save-member ]]; then
              [[ "$SCRAPE_AUTH_MODE" == guest ]] || { echo 'Authenticated scrape requires lane A.' >&2; exit 1; }
            fi
          fi
          # END hosted lane admission

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Require a successful published release artifact
        id: release
        if: inputs.release_run_id != ''
        shell: bash
        env:
          RELEASE_RUN_ID: ${{ inputs.release_run_id }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_RUN_ID" =~ ^[0-9]+$ ]] || { echo 'Release run ID must be numeric.' >&2; exit 1; }
          gh run view "$RELEASE_RUN_ID" --json conclusion,event,workflowName,headBranch \
            --jq 'select(.conclusion == "success" and .event == "workflow_dispatch" and .workflowName == "Hosted release" and .headBranch == "main") | .conclusion' \
            | grep -qx success
          names="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RELEASE_RUN_ID}/artifacts" \
            --jq '.artifacts[] | select(.expired == false and (.name | test("^matrx-extend-v[0-9]+\\.[0-9]+\\.[0-9]+$"))) | .name')"
          [[ "$names" =~ ^matrx-extend-v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Expected exactly one validated release artifact.' >&2; exit 1; }
          mkdir -p "$RUNNER_TEMP/release-artifact"
          gh run download "$RELEASE_RUN_ID" --name "$names" --dir "$RUNNER_TEMP/release-artifact"
          receipts="$(find "$RUNNER_TEMP/release-artifact" -type f -name release-receipt.json)"
          [[ -f "$receipts" ]] || { echo 'Expected exactly one release receipt.' >&2; exit 1; }
          echo "artifact_dir=$(dirname "$receipts")" >> "$GITHUB_OUTPUT"
          version="$(node -p "JSON.parse(require('fs').readFileSync(process.argv[1],'utf8')).version" "$receipts")"
          [[ "$names" == "matrx-extend-v${version}" ]] || { echo 'Artifact name and receipt version differ.' >&2; exit 1; }
          git fetch --quiet origin "refs/tags/v${version}:refs/tags/v${version}"
          source_sha="$(git rev-parse "v${version}^{commit}")"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"

      - name: Require exactly one artifact provenance mode
        shell: bash
        env:
          RELEASE_RUN_ID: ${{ inputs.release_run_id }}
          DEVELOPMENT_RUN_ID: ${{ inputs.development_run_id }}
          DEVELOPMENT_ARTIFACT_ID: ${{ inputs.development_artifact_id }}
          PUBLISHED_STORE_CRX: ${{ inputs.published_store_crx }}
          ACCEPTANCE_CASE: ${{ inputs.acceptance_case }}
          SCRAPE_DIAGNOSTIC_CPU_RATE: ${{ inputs.scrape_diagnostic_cpu_rate }}
          SCRAPE_AUTH_MODE: ${{ inputs.scrape_auth_mode }}
          SCRAPE_WIDTH_MODE: ${{ inputs.scrape_width_mode }}
          SCRAPE_NORMAL_WIDTH_PX: ${{ inputs.scrape_normal_width_px }}
          RUNNER_LABEL: ${{ inputs.runner_label }}
        run: |
          set -euo pipefail
          [[ "$RUNNER_LABEL" == macos-15-intel || "$RUNNER_LABEL" == macos-15 ]] || exit 1
          if [[ "$RUNNER_LABEL" == macos-15 ]]; then
            [[ "$RUNNER_ARCH" == ARM64 && "$(uname -m)" == arm64 ]] || exit 1
          else
            [[ "$RUNNER_ARCH" == X64 && "$(uname -m)" == x86_64 ]] || exit 1
          fi
          printf 'HOSTED_RUNNER_PLATFORM label=%s runner_arch=%s machine=%s\n' "$RUNNER_LABEL" "$RUNNER_ARCH" "$(uname -m)"
          if [[ -n "$SCRAPE_DIAGNOSTIC_CPU_RATE" ]]; then
            [[ "$ACCEPTANCE_CASE" == guest-scrape || "$ACCEPTANCE_CASE" == guest-scrape-development ]] || exit 1
            node -e 'const n=Number(process.argv[1]); if (!Number.isFinite(n)||n<=1) process.exit(1)' "$SCRAPE_DIAGNOSTIC_CPU_RATE"
          fi
          if [[ "$ACCEPTANCE_CASE" != guest-scrape && "$ACCEPTANCE_CASE" != guest-scrape-development && "$ACCEPTANCE_CASE" != scrape-save-member ]]; then
            [[ "$SCRAPE_AUTH_MODE" == guest && "$SCRAPE_WIDTH_MODE" == narrow && -z "$SCRAPE_NORMAL_WIDTH_PX" ]] || exit 1
          fi
          if [[ "$SCRAPE_WIDTH_MODE" == normal ]]; then
            node -e 'const n=Number(process.argv[1]); if (!Number.isSafeInteger(n)||n<=360) process.exit(1)' "$SCRAPE_NORMAL_WIDTH_PX"
          else
            [[ -z "$SCRAPE_NORMAL_WIDTH_PX" ]] || exit 1
          fi
          if [[ "$ACCEPTANCE_CASE" == member-chat || "$ACCEPTANCE_CASE" == guest-scrape ]]; then
            [[ -n "$RELEASE_RUN_ID" && -z "$DEVELOPMENT_RUN_ID" && -z "$DEVELOPMENT_ARTIFACT_ID" && "$PUBLISHED_STORE_CRX" != true ]] || exit 1
          fi
          if [[ "$ACCEPTANCE_CASE" == guest-scrape-development || "$ACCEPTANCE_CASE" == scrape-save-member ]]; then
            [[ -z "$RELEASE_RUN_ID" && -n "$DEVELOPMENT_RUN_ID" && -n "$DEVELOPMENT_ARTIFACT_ID" && "$PUBLISHED_STORE_CRX" != true ]] || exit 1
          fi
          if [[ "$ACCEPTANCE_CASE" == guest-seo || "$ACCEPTANCE_CASE" == guest-data || "$ACCEPTANCE_CASE" == member-data || "$ACCEPTANCE_CASE" == settings-persistence || "$ACCEPTANCE_CASE" == settings-persistence-admin || "$ACCEPTANCE_CASE" == settings-persistence-member || "$ACCEPTANCE_CASE" == desktop-settings-guest || "$ACCEPTANCE_CASE" == desktop-settings-member || "$ACCEPTANCE_CASE" == desktop-settings-admin || "$ACCEPTANCE_CASE" == visibility-census-guest || "$ACCEPTANCE_CASE" == visibility-census-member || "$ACCEPTANCE_CASE" == visibility-census-admin || "$ACCEPTANCE_CASE" == audit-key-admin || "$ACCEPTANCE_CASE" == profile-admin || "$ACCEPTANCE_CASE" == profile-member || "$ACCEPTANCE_CASE" == startup-resource-diagnostic ]]; then
            [[ -z "$RELEASE_RUN_ID" && -n "$DEVELOPMENT_RUN_ID" && -n "$DEVELOPMENT_ARTIFACT_ID" && "$PUBLISHED_STORE_CRX" != true ]] || exit 1
          fi
          if [[ "$ACCEPTANCE_CASE" == prepare-stale-results || "$ACCEPTANCE_CASE" == showcase-picker-admin || "$ACCEPTANCE_CASE" == showcase-stale-admin || "$ACCEPTANCE_CASE" == showcase-d47-admin || "$ACCEPTANCE_CASE" == showcase-d47-public-admin || "$ACCEPTANCE_CASE" == records-readonly-admin ]]; then
            [[ -z "$RELEASE_RUN_ID" && -n "$DEVELOPMENT_RUN_ID" && -n "$DEVELOPMENT_ARTIFACT_ID" && "$PUBLISHED_STORE_CRX" != true ]] || exit 1
          fi
          if [[ "$PUBLISHED_STORE_CRX" == true ]]; then
            [[ -z "$RELEASE_RUN_ID" && -z "$DEVELOPMENT_RUN_ID" && -z "$DEVELOPMENT_ARTIFACT_ID" ]] || exit 1
          elif [[ -n "$RELEASE_RUN_ID" ]]; then
            [[ -z "$DEVELOPMENT_RUN_ID" && -z "$DEVELOPMENT_ARTIFACT_ID" ]] || exit 1
          else
            [[ "$DEVELOPMENT_RUN_ID" =~ ^[1-9][0-9]*$ && "$DEVELOPMENT_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]] || exit 1
          fi

      - name: Require selected authentication before browser setup
        if: inputs.acceptance_case != 'startup-resource-diagnostic'
        env:
          MATRX_HOSTED_PHASE: preflight
          MATRX_HOSTED_ACCEPTANCE_CASE: ${{ inputs.acceptance_case }}
          MATRX_HOSTED_SEO_CASE_SCOPE: ${{ inputs.seo_case_scope }}
          MATRX_HOSTED_SEO_METADATA_FIXTURE: ${{ inputs.seo_metadata_fixture || 'none' }}
          MATRX_HOSTED_SEO_RESOURCE_DIAGNOSTIC: ${{ inputs.seo_resource_diagnostic == true && '1' || '0' }}
          MATRX_HOSTED_SEO_INTERRUPT_AFTER_TARGET: ${{ inputs.seo_interrupt_after_target || 'none' }}
          MATRX_HOSTED_DESKTOP_SETTINGS_CASE: ${{ inputs.desktop_settings_case }}
          MATRX_HOSTED_PUBLISHED_STORE_CRX: ${{ inputs.published_store_crx == true && '0.2.205' || '' }}
          MATRX_SCRAPE_DIAGNOSTIC_CPU_RATE: ${{ inputs.scrape_diagnostic_cpu_rate }}
          MATRX_SCRAPE_RELOAD_OPEN_DIAGNOSTIC: ${{ inputs.scrape_reload_open_diagnostic == true && '1' || '0' }}
          MATRX_SCRAPE_AUTH_MODE: ${{ inputs.scrape_auth_mode }}
          MATRX_SCRAPE_WIDTH_MODE: ${{ inputs.scrape_width_mode }}
          MATRX_SCRAPE_MIN_PANEL_WIDTH_PX: ${{ inputs.scrape_normal_width_px }}
          MATRX_HOSTED_MEMBER_LINK_JSON: ${{ secrets.MATRX_REVIEWER_MAGIC_LINK_JSON }}
          MATRX_HOSTED_ADMIN_CREDENTIALS_JSON: ${{ secrets.MATRX_PREPARE_ADMIN_CREDENTIALS_JSON }}
          MATRX_HOSTED_PROFILE_ORGANIZATION_JSON: ${{ secrets.MATRX_PROFILE_APPROVED_ORGANIZATION_JSON }}
        run: node scripts/hosted-guest-acceptance.mjs

      - name: Disable indexing on the disposable hosted VM
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RUNNER_ENVIRONMENT" == github-hosted && "$RUNNER_OS" == macOS ]] || exit 1
          sudo /usr/bin/mdutil -i off /
          sudo /usr/bin/mdutil -i off /System/Volumes/Data
          root_status="$(/usr/bin/mdutil -s /)"
          data_status="$(/usr/bin/mdutil -s /System/Volumes/Data)"
          printf '%s\n%s\n' "$root_status" "$data_status"
          [[ "$root_status" == *"Indexing disabled."* ]] || exit 1
          [[ "$data_status" == *"Indexing disabled."* ]] || exit 1

      - name: Wait for measured package readiness
        run: node scripts/hosted-resource-readiness.mjs

      - name: Prepare pinned browser driver under an owned permit
        env:
          MATRX_HOSTED_PHASE: package
          MATRX_HOSTED_ACCEPTANCE_CASE: ${{ inputs.acceptance_case }}
          MATRX_HOSTED_DESKTOP_SETTINGS_CASE: ${{ inputs.desktop_settings_case }}
          MATRX_HOSTED_BROWSER_RUNTIME_DIR: ${{ runner.temp }}/browser-runtime
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/playwright-browsers
        run: |
          mkdir -p "$RUNNER_TEMP/guest-resource-profile"
          node scripts/stabilization-resource.mjs run --run-id "hosted-package-${{ github.run_id }}-${{ github.run_attempt }}" --profile-dir "$RUNNER_TEMP/guest-resource-profile" -- node scripts/hosted-guest-acceptance.mjs

      - name: Wait for measured browser readiness
        run: node scripts/hosted-resource-readiness.mjs

      - name: Prepare full Chromium under a fresh owned permit
        env:
          MATRX_HOSTED_PHASE: browser
          MATRX_HOSTED_ACCEPTANCE_CASE: ${{ inputs.acceptance_case }}
          MATRX_HOSTED_BROWSER_RUNTIME_DIR: ${{ runner.temp }}/browser-runtime
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/playwright-browsers
        run: |
          node scripts/stabilization-resource.mjs run --run-id "hosted-browser-${{ github.run_id }}-${{ github.run_attempt }}" --profile-dir "$RUNNER_TEMP/guest-resource-profile" -- node scripts/hosted-guest-acceptance.mjs

      - name: Wait for measured acceptance readiness
        run: node scripts/hosted-resource-readiness.mjs

      - name: Exercise the selected Chrome side-panel case
        if: inputs.acceptance_case != 'startup-resource-diagnostic'
        shell: bash
        env:
          MATRX_PLAYWRIGHT_MODULE: ${{ runner.temp }}/browser-runtime/node_modules/playwright-core/index.mjs
          MATRX_HOSTED_BROWSER_RUNTIME_DIR: ${{ runner.temp }}/browser-runtime
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/playwright-browsers
          MATRX_HOSTED_RELEASE_ARTIFACT_DIR: ${{ steps.release.outputs.artifact_dir }}
          MATRX_HOSTED_GUEST_OUTPUT_DIR: ${{ runner.temp }}/guest-acceptance
          MATRX_HOSTED_RELEASE_SHA: ${{ steps.release.outputs.source_sha }}
          MATRX_HOSTED_DEV_RUN_ID: ${{ inputs.development_run_id }}
          MATRX_HOSTED_DEV_ARTIFACT_ID: ${{ inputs.development_artifact_id }}
          MATRX_HOSTED_PUBLISHED_STORE_CRX: ${{ inputs.published_store_crx == true && '0.2.205' || '' }}
          MATRX_HOSTED_ACCEPTANCE_CASE: ${{ inputs.acceptance_case }}
          MATRX_HOSTED_ACCEPTANCE_LANE: ${{ inputs.acceptance_lane }}
          MATRX_HOSTED_DESKTOP_SETTINGS_CASE: ${{ inputs.desktop_settings_case }}
          MATRX_D47_RESPONSE_ORDER: ${{ inputs.d47_response_order }}
          MATRX_HOSTED_SEO_CASE_SCOPE: ${{ inputs.seo_case_scope }}
          MATRX_HOSTED_SEO_METADATA_FIXTURE: ${{ inputs.seo_metadata_fixture || 'none' }}
          MATRX_HOSTED_SEO_RESOURCE_DIAGNOSTIC: ${{ inputs.seo_resource_diagnostic == true && '1' || '0' }}
          MATRX_HOSTED_SEO_INTERRUPT_AFTER_TARGET: ${{ inputs.seo_interrupt_after_target || 'none' }}
          MATRX_STARTUP_INTERVAL_DIAGNOSTIC: ${{ inputs.seo_resource_diagnostic == true && '1' || '0' }}
          MATRX_D47_PUBLIC_RACE_PREFLIGHT: ${{ inputs.d47_public_race_preflight == true && '1' || '0' }}
          MATRX_SCRAPE_DIAGNOSTIC_CPU_RATE: ${{ inputs.scrape_diagnostic_cpu_rate }}
          MATRX_SCRAPE_RELOAD_OPEN_DIAGNOSTIC: ${{ inputs.scrape_reload_open_diagnostic == true && '1' || '0' }}
          MATRX_SCRAPE_AUTH_MODE: ${{ inputs.scrape_auth_mode }}
          MATRX_SCRAPE_WIDTH_MODE: ${{ inputs.scrape_width_mode }}
          MATRX_SCRAPE_MIN_PANEL_WIDTH_PX: ${{ inputs.scrape_normal_width_px }}
          MATRX_HOSTED_MEMBER_LINK_JSON: ${{ secrets.MATRX_REVIEWER_MAGIC_LINK_JSON }}
          MATRX_HOSTED_ADMIN_CREDENTIALS_JSON: ${{ secrets.MATRX_PREPARE_ADMIN_CREDENTIALS_JSON }}
          MATRX_HOSTED_PROFILE_ORGANIZATION_JSON: ${{ secrets.MATRX_PROFILE_APPROVED_ORGANIZATION_JSON }}
          WXT_SUPABASE_URL: ${{ secrets.WXT_SUPABASE_URL }}
          WXT_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.WXT_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          mkdir -p "$RUNNER_TEMP/guest-resource-profile"
          node scripts/stabilization-resource.mjs run --run-id "hosted-guest-${{ github.run_id }}-${{ github.run_attempt }}" --profile-dir "$RUNNER_TEMP/guest-resource-profile" -- node scripts/hosted-guest-acceptance.mjs

      - name: Measure owned Chromium startup during the existing guard interval
        if: inputs.acceptance_case == 'startup-resource-diagnostic'
        env:
          MATRX_HOSTED_PHASE: startup-diagnostic
          MATRX_STARTUP_DISPLAY_MODE: ${{ inputs.startup_display_mode }}
          MATRX_STARTUP_INTERVAL_DIAGNOSTIC: '1'
          MATRX_PLAYWRIGHT_MODULE: ${{ runner.temp }}/browser-runtime/node_modules/playwright-core/index.mjs
          MATRX_HOSTED_ACCEPTANCE_CASE: startup-resource-diagnostic
          MATRX_HOSTED_BROWSER_RUNTIME_DIR: ${{ runner.temp }}/browser-runtime
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/playwright-browsers
          MATRX_HOSTED_GUEST_OUTPUT_DIR: ${{ runner.temp }}/guest-acceptance
          MATRX_HOSTED_DEV_RUN_ID: ${{ inputs.development_run_id }}
          MATRX_HOSTED_DEV_ARTIFACT_ID: ${{ inputs.development_artifact_id }}
        run: |
          node scripts/stabilization-resource.mjs run --run-id "hosted-startup-${{ github.run_id }}-${{ github.run_attempt }}" --profile-dir "$RUNNER_TEMP/guest-resource-profile" -- node scripts/hosted-guest-acceptance.mjs

      - name: Upload browser result and native-panel screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hosted-guest-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          path: |
            docs/stabilization/resource-journals/hosted-*.jsonl
            test-results/guest-chat-store-*.json
            test-results/scrape-guest-native-*.json
            test-results/scrape-save-native-acceptance.json
            test-results/seo-guest-acceptance.json
            test-results/data-guest-native-acceptance.json
            test-results/data-member-native-acceptance.json
            test-results/settings-local-controls-acceptance.json
            test-results/settings-auto-scrape-capture-native.json
            test-results/settings-d87-native-*.json
            test-results/visibility-census-*.json
            test-results/visibility-census-guest.json.guest-account-readiness.png
            test-results/settings-desktop-native-*.json
